<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — Теплосчёт</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070e;color:#f2edf8;font:17px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 10px;color:#ffd34d}
p{color:#9d96b4;margin:0 0 24px}
a{display:inline-block;padding:12px 20px;border-radius:12px;background:linear-gradient(92deg,#ffd34d,#ff8a2a);color:#1a0d00;font-weight:700;text-decoration:none}
</style>
<!-- Yandex.Metrika counter -->
<script>
(function(){
  var KEY='ts-cookie-consent', ID=113983509;
  function get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function set(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }
  function loadYM(){
    if(window.__ymLoaded) return; window.__ymLoaded=true;
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
    for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window,document,'script','https://mc.yandex.ru/metrika/tag.js?id='+ID,'ym');
    ym(ID,'init',{ssr:true,webvisor:false,clickmap:true,accurateTrackBounce:true,trackLinks:true});
  }
  function banner(){
    if(document.getElementById('cookie-bar')) return;
    var css=document.createElement('style');
    css.textContent='#cookie-bar{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line,#2a2540);border-radius:16px;background:linear-gradient(160deg,#1c1324,#110f1b 60%);box-shadow:0 18px 50px rgba(0,0,0,.55);color:var(--ink,#f2edf8);font:14px/1.5 var(--f-body,system-ui,sans-serif)}'+
    '#cookie-bar p{margin:0;flex:1;color:var(--muted,#9d96b4)}#cookie-bar a{color:var(--warm,#ffd34d)}'+
    '#cookie-bar .cb-btns{display:flex;gap:8px;flex-shrink:0}'+
    '#cookie-bar button{font:600 14px/1 var(--f-body,system-ui,sans-serif);padding:11px 16px;border-radius:11px;cursor:pointer;border:1px solid var(--line,#2a2540);background:transparent;color:var(--ink,#f2edf8)}'+
    '#cookie-bar button.cb-ok{border:0;background:linear-gradient(92deg,var(--warm,#ffd34d),var(--hot,#ff8a2a));color:#1a0d00}'+
    '#cookie-bar button:focus-visible{outline:2px solid var(--warm,#ffd34d);outline-offset:2px}'+
    '@media (max-width:600px){#cookie-bar{flex-direction:column;align-items:stretch;left:12px;right:12px;bottom:12px}#cookie-bar .cb-btns button{flex:1}}';
    document.head.appendChild(css);
    var d=document.createElement('div'); d.id='cookie-bar'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Согласие на cookie');
    d.innerHTML='<p>Сайт использует cookie и Яндекс Метрику, чтобы считать посещения. Подробнее — в <a href="privacy.html">политике конфиденциальности</a>.</p><div class="cb-btns"><button type="button" class="cb-no">Отказаться</button><button type="button" class="cb-ok">Принять</button></div>';
    document.body.appendChild(d);
    d.querySelector('.cb-ok').onclick=function(){ set('yes'); d.remove(); loadYM(); };
    d.querySelector('.cb-no').onclick=function(){ set('no'); d.remove(); };
  }
  window.tsCookieReset=function(){ try{ localStorage.removeItem(KEY); }catch(e){} banner(); };
  var c=get();
  if(c==='yes') loadYM();
  else if(c!=='no'){ if(document.body) banner(); else document.addEventListener('DOMContentLoaded',banner); }
})();
</script>
<!-- /Yandex.Metrika counter -->
</head>
<body>
<div>
<h1>Страница не найдена</h1>
<p>Возможно, она переехала. Калькулятор расхода газа на месте.</p>
<a href="/">На главную</a>
</div>
</body>
</html>
